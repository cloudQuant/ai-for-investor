# Dependabot configuration (iteration 193 Task D).
# Keeps dependencies current across all four ecosystems used by the repo.
# Updates arrive weekly; ratchets (npm_audit / pip-audit) gate landing on
# regressing vulnerability counts.

version: 2

updates:
  # Python backend (pip) - production + dev locks live in config/
  - package-ecosystem: "pip"
    directory: "/src/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    # mypy 2.x is deferred (194 Task J): the repo-wide ratchet baseline is
    # pinned to mypy 1.20.2; upgrading requires lock + baseline regeneration
    # plus a re-audit of the 759 historical errors (194 Task I).
    ignore:
      - dependency-name: "mypy"
        versions: [">=2"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    # pinia 3+/4 and @vitejs/plugin-vue 6 are major migrations deferred to
    # 194 Task J: they need full vitest/build validation and possibly code
    # adaptation before landing, not just the ratchet baseline refresh.
    # Temporary compatibility holds: typescript-eslint 8.71.2 requires
    # TypeScript <6.1; jsdom 30.1.1 drops Node 20; Element Plus 2.14.6 pulls
    # @vueuse/core 15 (Node >=22) and breaks current vue-tsc 2 types. Remove
    # these after the runtime and toolchain receive a dedicated upgrade.
    ignore:
      - dependency-name: "pinia"
        versions: [">=3"]
      - dependency-name: "@vitejs/plugin-vue"
        versions: [">=6"]
      - dependency-name: "typescript"
        versions: [">=6.1"]
      - dependency-name: "jsdom"
        versions: [">=30"]
      - dependency-name: "element-plus"
        versions: [">=2.14.6"]

  # Docker base images
  # Runtime majors (python >=3.13, node >=21) are deferred to 194 Task J:
  # the publish pipeline has no pre-release validation, so each upgrade
  # needs a dedicated compatibility check first. Patch tags still flow.
  - package-ecosystem: "docker"
    directory: "/src/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "python"
        versions: [">=3.13"]

  - package-ecosystem: "docker"
    directory: "/src/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
        versions: [">=21"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
