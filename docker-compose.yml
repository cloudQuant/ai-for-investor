version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-for-investor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ai_for_investor
      MYSQL_USER: ai_for_investor
      MYSQL_PASSWORD: ai_for_investor_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ai-for-investor-mongodb
    environment:
      MONGO_INITDB_DATABASE: ai_for_investor
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-for-investor-redis
    command: redis-server --requirepass redis_password --rename-command KEYS "" --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-for-investor-backend
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ai_for_investor
      MYSQL_PASSWORD: ai_for_investor_password
      MYSQL_DATABASE: ai_for_investor
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: ai_for_investor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-for-investor-frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
