[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5

# Markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    performance: marks tests as performance benchmark tests
    security: marks tests as security penetration tests
    flaky: reruns an intermittently failing integration test (pytest-rerunfailures)

# Timeout (requires pytest-timeout)
# SIGALRM reports a timeout as a normal failure with the stalled stack. The thread
# method calls os._exit(1), which under xdist surfaces only as an unattributable
# "node down: Not properly terminated" and hides what was running.
timeout = 60
timeout_method = signal

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

# Logging
log_cli = false
log_cli_level = INFO
