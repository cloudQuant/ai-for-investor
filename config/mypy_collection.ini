# Mypy scope for the data-collection scripts under `app/data_fetch/scripts`.
#
# `src/backend/pyproject.toml` keeps `scripts/` in its mypy `exclude`, and that pattern is a
# substring match, so it also swallowed `app/data_fetch/scripts/` - 1108 tracked files that
# nothing ever type-checked. This config mirrors `[tool.mypy]` with that one entry narrowed,
# so the collection tree is visible as its own ratcheted scope while the repo-wide `mypy app`
# count stays what it is today.
#
# `tests/test_mypy_collection_scope_config.py` asserts every option below still equals
# `pyproject.toml`, so they cannot drift apart silently.

[mypy]
python_version = 3.10
plugins = pydantic.mypy
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
exclude = (?x)(
    ^alembic/
    | ^migrations/
    | ^tests/
    | ^scripts/
    | ^\.venv
    | ^build/
    | ^dist/
  )
