###############################################################################
# ai-for-investor - Production Docker Compose
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/compose/prod.yml up -d
#
# Prerequisites:
#   - Create src/backend/.env (see scripts/docker_deploy.sh)
#   - Docker Engine 24+ and Docker Compose v2
###############################################################################

services:
  # ========================= MySQL =========================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_for_investor}
      MYSQL_USER: ${DB_USER:-backtrader}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - ${MYSQL_DATA_DIR:-./runtime/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backtrader

  # ========================= Redis =========================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${REDIS_DATA_DIR:-./runtime/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backtrader

  # ========================= Backend API =========================
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      # App
      APP_NAME: ai-for-investor
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # Database
      DATABASE_TYPE: mysql
      DATABASE_URL: mysql+aiomysql://${DB_USER:-backtrader}:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_HOST:-mysql}:${DB_PORT:-3306}/${DB_NAME:-ai_for_investor}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "10080"
      # Server
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${SERVER_DOMAIN:-localhost},http://${SERVER_DOMAIN:-localhost},http://localhost}
      # Admin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      # Application startup only checks the migrated revision; bootstrap is a
      # separate one-shot operation after the migration job.
      DB_AUTO_CREATE_SCHEMA: "false"
      DB_AUTO_CREATE_DEFAULT_ADMIN: "false"
      # Backtest
      BACKTEST_TIMEOUT: "300"
      # Worker concurrency (Gunicorn workers)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Akshare
      AKSHARE_SCHEDULER_TIMEZONE: Asia/Shanghai
      AKSHARE_SCRIPT_ROOT: app/data_fetch/scripts
      AKSHARE_INTERFACE_BOOTSTRAP_MODE: manual
      # Timezone
      TZ: Asia/Shanghai
    volumes:
      - ./datas:/opt/workspace/ai-for-investor/datas
      - ./strategies:/opt/workspace/ai-for-investor/strategies
      - ./workspace_units:/opt/workspace/ai-for-investor/workspace_units
      - ${BACKEND_LOGS_DIR:-./runtime/backend/logs}:/opt/workspace/ai-for-investor/src/backend/logs
      - ${BACKEND_APP_DATA_DIR:-./runtime/backend/data}:/opt/workspace/ai-for-investor/src/backend/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:{}/health'.format(os.environ.get('PORT', '8000')))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backtrader

  # ========================= One-shot schema migration =========================
  migrate:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: "no"
    environment:
      APP_NAME: ai-for-investor
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_TYPE: mysql
      DATABASE_URL: mysql+aiomysql://${DB_USER:-backtrader}:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_HOST:-mysql}:${DB_PORT:-3306}/${DB_NAME:-ai_for_investor}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "10080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DB_AUTO_CREATE_SCHEMA: "false"
      DB_AUTO_CREATE_DEFAULT_ADMIN: "false"
      MARKET_DATA_SEMANTIC_RECORD_KEY_MAINTENANCE_FENCE: ${MARKET_DATA_SEMANTIC_RECORD_KEY_MAINTENANCE_FENCE:-}
      MARKET_DATA_B2_COMPLETENESS_EVIDENCE_MAINTENANCE_FENCE: ${MARKET_DATA_B2_COMPLETENESS_EVIDENCE_MAINTENANCE_FENCE:-}
      TZ: Asia/Shanghai
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backtrader

  # ========================= Frontend (Nginx) =========================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.prod.http.conf.template:/etc/nginx/templates/http.conf.template:ro
      - ./docker/nginx.prod.tls.conf.template:/etc/nginx/templates/tls.conf.template:ro
      - ./docker/nginx.prod.locations.conf:/etc/nginx/conf.d/ai-investor-proxy.inc:ro
      - ./docker/nginx-prod-entrypoint.sh:/usr/local/bin/nginx-prod-entrypoint.sh:ro
      - ./runtime/certbot/conf:/etc/letsencrypt:ro
      - ./runtime/certbot/www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-prod-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
      CERT_NAME: ${CERT_NAME:-${SERVER_DOMAIN:-localhost}}
      TLS_ENABLED: ${TLS_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backtrader

  # ========================= Certbot (SSL Certificate) =========================
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - ./runtime/certbot/conf:/etc/letsencrypt
      - ./runtime/certbot/www:/var/www/certbot
      - ./docker/entrypoint-certbot-renew.sh:/docker/entrypoint-certbot-renew.sh:ro
    entrypoint: ["/bin/sh", "/docker/entrypoint-certbot-renew.sh"]
    environment:
      CERT_NAME: ${CERT_NAME:-${SERVER_DOMAIN:-localhost}}

networks:
  backtrader:
    driver: bridge
