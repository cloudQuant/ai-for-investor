# HTTP-only Nginx config used by the local Compose overlay and as a safe
# bootstrap/fallback configuration when a TLS certificate is absent or invalid.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/ai-investor-proxy.inc;
}
